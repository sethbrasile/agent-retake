name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
          version: "0.13.0"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
      - run: uv build && uv run python tests/check_distribution.py
      - run: uvx --from ./dist/agent_retake-0.1.0-py3-none-any.whl retake --help
