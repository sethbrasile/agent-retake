[project]
name = "agent-retake"
version = "0.1.0"
description = "Turn saved coding-agent conversations into narration-paced terminal footage."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6.0.3,<7", "playwright>=1.59,<2"]

[project.optional-dependencies]
align = ["faster-whisper>=1.2,<2"]

[project.scripts]
retake = "agent_retake.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
